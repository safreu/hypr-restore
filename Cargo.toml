[package]
name = "hypr-restore"
version = "0.2.0"
edition = "2024"
authors = ["Samuel Freundel"]
license = "MIT"
repository = "https://github.com/safreu/hypr-restore"
description = "A tool to restore opened applications for hyprland"
keywords = ["hyprland", "backup", "restore", "event-listener", "tracker"]
categories = ["command-line-utilities"]
readme = "./readme.md"
exclude = [
  ".idea/",
  ".github/",
  ".cargo_vcs_info.json",
  "Cargo.toml.orig",
  ".gitignore",
  "Cargo.lock",
]

[lib]
path = "src/lib.rs"

[[bin]]
name = "hypr-restore"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.52", features = ["derive"] }
dirs = "6.0.0"
colored = "3"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
log = "0.4.28"
serde_json = "1.0.145"
tempfile = "3.23.0"
regex = "1.12.2"
ratatui = "0.29.0"
crossterm = "0.29.0"
sha2 = "0.10.9"
ansi-to-tui = "7.0.0"
